            type: object
            list: { min: 4, max: 4, collapsible: { collapsed: true, summary: "{dove}" } }
            fields:
              - { name: dove, label: "Dove si trova", type: string, readonly: true }
              - { name: testo, label: Testo, type: rich-text, options: { format: html, media: false } }
          - name: benvenuti
            label: "Benvenuti in Tanzania"
            type: object
            list: { min: 13, max: 13, collapsible: { collapsed: true, summary: "{dove}" } }
            fields:
              - { name: dove, label: "Dove si trova", type: string, readonly: true }
              - { name: testo, label: Testo, type: rich-text, options: { format: html, media: false } }
          - name: itinerario
            label: "Dall'oceano agli altopiani, e ritorno"
            type: object
            list: { min: 5, max: 5, collapsible: { collapsed: true, summary: "{dove}" } }
